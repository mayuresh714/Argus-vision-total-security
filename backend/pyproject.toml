[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "argus-backend"
version = "0.1.0"
description = "Argus v0 — single-camera CCTV suspicious-activity detection service"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "mayuresh714" }]
dependencies = [
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
# Real camera / file sources need OpenCV. The core pipeline does NOT import it,
# so tests and the mock backend run without it.
video = ["opencv-python-headless>=4.9", "numpy>=1.24"]
dev = ["pytest>=8.0", "pytest-cov>=4.1", "httpx>=0.27"]

[project.scripts]
argus = "argus.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
